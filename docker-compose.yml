services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pickup
      POSTGRES_PASSWORD: pickup
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickup -d pickup"]
      interval: 2s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pickup:pickup@db:5432/pickup?connection_limit=20}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql://pickup:pickup@db:5432/pickup_test?connection_limit=20}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-development-webhook-secret}
      PORT: ${PORT:-4000}
      HOLD_SECONDS: ${HOLD_SECONDS:-120}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  postgres_data:
