name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://pickup:pickup@localhost:5432/pickup_test?connection_limit=20
      TEST_DATABASE_URL: postgresql://pickup:pickup@localhost:5432/pickup_test?connection_limit=20
      WEBHOOK_SECRET: ci-only-webhook-secret
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pickup_test
          POSTGRES_USER: pickup
          POSTGRES_PASSWORD: pickup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pickup -d pickup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
